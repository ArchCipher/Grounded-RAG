[project]
name = "grounded-rag"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb",
    "fastapi",
    "google-genai",
    "langchain-text-splitters",
    "pymupdf4llm",
    "pydantic",
    "python-dotenv",
    "uvicorn",
    "requests",
    "mcp>=1.0.0",
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest",
]

[tool.ruff]
target-version = "py312" # Python 3.12
line-length = 88 # 88 characters per line

[tool.ruff.format]
quote-style = "double" # Use double quotes for strings

[tool.pyright]
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportImportCycles = "error"

pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: requires a running Gemini API key and a populated ChromaDB (skipped in CI)",
]
